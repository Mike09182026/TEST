<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的軟體下載頁面</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f6f9;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 { color: #333; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 30px; }
        .download-btn {
            background-color: #2ea44f;
            color: white;
            padding: 14px 28px;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            border-radius: 6px;
            transition: background 0.2s;
            display: inline-block;
        }
        .download-btn:hover {
            background-color: #2c974b;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>GitHub Release Test 軟體</h1>
        <p>點擊下方按鈕即可下載最新版本的安裝包 (.exe)</p>
        <!-- 下方連結已自動設定為你的最新版軟體 -->
        <a class="download-btn" href="https://github.com/Mike09182026/TEST/releases/latest/download/GitHubReleaseTest.exe">
            免費下載 Windows 版 (.exe)
        </a>
    </div>
</body>
</html>
