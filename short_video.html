<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>JBA128G3 Storage Shield - 30s Explainer Video</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    /* 100% 填滿 iframe，無多餘邊框或滾動條 */
    .video-viewport {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: #05080e;
    }
    /* 背景圖片與動態呼吸 */
    .video-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('video_bg.jpg') center/cover no-repeat;
      filter: brightness(0.65) contrast(1.15);
      transition: transform 0.8s ease;
      z-index: 1;
    }
    .video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(0, 15, 30, 0.25) 0%, rgba(2, 6, 14, 0.92) 100%);
      z-index: 2;
    }
    /* 頂部雷達光束掃描 */
    .scan-line {
      position: absolute;
      top: -20%;
      left: 0;
      width: 100%;
      height: 15%;
      background: linear-gradient(to bottom, transparent, rgba(0, 240, 255, 0.35), transparent);
      z-index: 3;
      animation: scanAnim 3.5s linear infinite;
      pointer-events: none;
    }
    @keyframes scanAnim {
      0% { top: -20%; }
      100% { top: 110%; }
    }
    /* 頂部進度條 */
    .progress-bar-container {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      height: 3px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 2px;
      overflow: hidden;
      z-index: 10;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00f0ff, #00ff88);
      box-shadow: 0 0 10px #00f0ff;
      transition: width 0.1s linear;
    }
    /* 頂部品牌標記 */
    .top-brand {
      position: absolute;
      top: 22px;
      left: 14px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 900;
      font-size: 0.75rem;
      letter-spacing: 0.8px;
      color: #fff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    }
    .top-brand span { color: #00f0ff; }

    /* 聲音切換鈕 (右上角) */
    .sound-btn {
      position: absolute;
      top: 20px;
      right: 14px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: #00f0ff;
      border-radius: 20px;
      padding: 3px 8px;
      font-size: 0.7rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* 右側互動裝飾 (TikTok / Reels 風格) */
    .side-actions {
      position: absolute;
      right: 10px;
      bottom: 85px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    .side-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.65rem;
      color: #cbd5e0;
      gap: 2px;
    }
    .side-icon {
      width: 34px;
      height: 34px;
      background: rgba(15, 23, 36, 0.75);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      backdrop-filter: blur(4px);
    }

    /* 中央分鏡容器 */
    .scene-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 18px 80px 18px;
      text-align: center;
    }
    .scene-tag {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid #00f0ff;
      color: #00f0ff;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      display: inline-block;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }
    .scene-visual {
      font-size: 3.8rem;
      margin-bottom: 18px;
      filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.8));
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    /* 爆款英文彈跳大字報 */
    .caption-box {
      min-height: 90px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }
    .caption-main {
      font-size: 1.35rem;
      font-weight: 900;
      line-height: 1.3;
      color: #ffffff;
      text-shadow: 0 3px 10px rgba(0,0,0,0.9), 0 0 20px rgba(0,0,0,0.9);
      letter-spacing: 0.2px;
    }
    .highlight-yellow {
      color: #ffe600;
      text-shadow: 0 0 15px rgba(255, 230, 0, 0.8);
      font-size: 1.45rem;
    }
    .highlight-cyan {
      color: #00f0ff;
      text-shadow: 0 0 15px rgba(0, 240, 255, 0.8);
      font-size: 1.45rem;
    }
    .highlight-red {
      color: #ff3366;
      text-shadow: 0 0 15px rgba(255, 51, 102, 0.8);
      font-size: 1.45rem;
    }
    .caption-sub {
      font-size: 0.82rem;
      color: #a0aec0;
      font-weight: 500;
      line-height: 1.35;
      text-shadow: 0 2px 5px rgba(0,0,0,0.8);
      max-width: 90%;
    }

    /* 底部行動條 */
    .bottom-cta-banner {
      position: absolute;
      bottom: 14px;
      left: 12px;
      right: 12px;
      background: rgba(10, 20, 35, 0.88);
      border: 1px solid rgba(0, 240, 255, 0.35);
      padding: 8px 12px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      backdrop-filter: blur(8px);
    }
    .cta-title { font-size: 0.72rem; font-weight: 800; color: #fff; }
    .cta-sub { font-size: 0.6rem; color: #00f0ff; }
    .cta-btn-mini {
      background: linear-gradient(135deg, #00f0ff, #0077ff);
      color: #000;
      font-weight: 800;
      font-size: 0.7rem;
      padding: 5px 10px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }

    /* 畫面中央覆蓋播放/暫停按鈕 */
    .play-overlay-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 64px;
      height: 64px;
      background: rgba(0, 240, 255, 0.2);
      border: 2px solid #00f0ff;
      border-radius: 50%;
      color: #00f0ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      cursor: pointer;
      z-index: 20;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.5);
      transition: all 0.2s ease;
    }
    .play-overlay-btn:hover {
      transform: translate(-50%, -50%) scale(1.1);
      background: #00f0ff;
      color: #000;
    }
    .play-overlay-btn.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="video-viewport" id="viewport" onclick="togglePlay()">
    <div class="video-bg" id="videoBg"></div>
    <div class="video-overlay"></div>
    <div class="scan-line"></div>

    <!-- 頂部進度條 -->
    <div class="progress-bar-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- 頂部品牌標記 -->
    <div class="top-brand">
      <span style="font-size:0.95rem;">🛡️</span>
      <div>JBA128G3 <span>STORAGE SHIELD</span></div>
    </div>

    <!-- 語音切換鈕 -->
    <div class="sound-btn" onclick="event.stopPropagation(); toggleVoice();" id="soundBtn">
      <span>🔊 AI Voice: ON</span>
    </div>

    <!-- 右側 TikTok 風格按鈕 (English) -->
    <div class="side-actions">
      <div class="side-btn"><div class="side-icon">❤️</div><span>24.8K</span></div>
      <div class="side-btn"><div class="side-icon">💬</div><span>3.6K</span></div>
      <div class="side-btn"><div class="side-icon">⭐</div><span>18.2K</span></div>
      <div class="side-btn"><div class="side-icon">🔗</div><span>Share</span></div>
    </div>

    <!-- 中央分鏡視覺與字幕 -->
    <div class="scene-container">
      <div class="scene-tag" id="sceneTag">⚠️ DATA LEAK ALERT</div>
      <div class="scene-visual" id="sceneVisual">🗑️💥</div>
      <div class="caption-box">
        <div class="caption-main" id="captionMain">Think Deleting Files<br><span class="highlight-red">Makes Them Safe?</span></div>
        <div class="caption-sub" id="captionSub">Recovery tools can uncover all your secrets in 3 seconds!</div>
      </div>
    </div>

    <!-- 中央懸浮播放按鈕 -->
    <div class="play-overlay-btn" id="playOverlayBtn">
      <span>▶</span>
    </div>

    <!-- 底部行動條 (English) -->
    <div class="bottom-cta-banner" onclick="event.stopPropagation(); replay();">
      <div>
        <div class="cta-title">JBA128G3 Storage Shield v1.0.3</div>
        <div class="cta-sub">100% Offline ｜ Free Decryption</div>
      </div>
      <button class="cta-btn-mini">Replay ↺</button>
    </div>
  </div>

  <script>
    // 6 段全英文爆款短影音分鏡數據
    const scenes = [
      {
        start: 0,
        duration: 4.5,
        tag: "⚠️ DATA LEAK ALERT",
        visual: "🗑️💥",
        main: "Think Deleting Files<br><span class='highlight-red'>Makes Them Safe?</span>",
        sub: "Wrong! Recovery tools can uncover your secrets in 3 seconds!",
        speech: "Think moving confidential files to the Recycle Bin makes them safe? Wrong! Ordinary recovery tools can expose your secrets in three seconds!",
        scale: 1.0,
        pitch: 130
      },
      {
        start: 4.5,
        duration: 5.5,
        tag: "🛡️ POST-QUANTUM SHIELD",
        visual: "🔒⚡",
        main: "Stop Cloud Leaks!<br><span class='highlight-cyan'>JBA128G3 Storage Shield</span>",
        sub: "CB Tec Post-Quantum Geometric Stream Encryption. Zero backdoors.",
        speech: "Stop cloud leaks now! JBA128G3 Storage Shield features post-quantum geometric stream encryption with zero backdoors.",
        scale: 1.15,
        pitch: 240
      },
      {
        start: 10.0,
        duration: 5.5,
        tag: "🚀 20 GB PROJECT VAULT",
        visual: "📁📦",
        main: "Drag & Drop Folders!<br><span class='highlight-yellow'>20 GB Massive Files</span>",
        sub: "64MB Zero-Copy Streaming. RAM usage strictly under 200MB!",
        speech: "Drag and drop massive project folders! Handles up to 20 gigabytes with zero-copy streaming, keeping RAM usage below 200 megabytes!",
        scale: 1.25,
        pitch: 320
      },
      {
        start: 15.5,
        duration: 5.0,
        tag: "🔥 PHYSICAL DATA WIPING",
        visual: "⚙️🌪️",
        main: "JBA-Shredder <span class='highlight-red'>Destroys</span><br>Unencrypted Source Files!",
        sub: "Automatic physical overwrite upon verification. Zero forensic recovery.",
        speech: "Built-in physical shredder! Automatically overwrites and destroys source files upon verification, leaving forensic tools completely helpless!",
        scale: 1.1,
        pitch: 180
      },
      {
        start: 20.5,
        duration: 5.0,
        tag: "💎 VIRAL COLLABORATION",
        visual: "💎✨",
        main: "100% Bit-Perfect Match<br><span class='highlight-yellow'>Decryption Free Forever!</span>",
        sub: "Send to clients or teammates. Decrypt with zero cost and no account!",
        speech: "Bit-perfect binary restoration. Best of all: decryption is completely free forever with no limits!",
        scale: 1.2,
        pitch: 440
      },
      {
        start: 25.5,
        duration: 4.5,
        tag: "🏆 RECLAIM DATA SOVEREIGNTY",
        visual: "🏆🛡️",
        main: "100% Offline & Pure<br><span class='highlight-cyan'>Get v1.0.3 Release</span>",
        sub: "Zero telemetry. Download now and shield your valuable assets!",
        speech: "One hundred percent offline, zero telemetry. Download version 1.0.3 today and reclaim your local data sovereignty!",
        scale: 1.3,
        pitch: 520
      }
    ];

    const TOTAL_DURATION = 30.0;
    let isPlaying = false;
    let voiceEnabled = true;
    let currentTime = 0;
    let lastTimestamp = null;
    let currentSceneIndex = -1;
    let audioCtx = null;

    function playBeep(freq, type = 'sine', duration = 0.15) {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function speakEnglishText(text) {
      if (!voiceEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 1.15;
      utterance.pitch = 1.05;
      window.speechSynthesis.speak(utterance);
    }

    function toggleVoice() {
      voiceEnabled = !voiceEnabled;
      document.getElementById('soundBtn').innerHTML = voiceEnabled ? "🔊 AI Voice: ON" : "🔇 AI Voice: OFF";
      if (!voiceEnabled && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    function updateScene(index) {
      if (index === currentSceneIndex) return;
      currentSceneIndex = index;
      const s = scenes[index];

      playBeep(s.pitch, 'triangle', 0.2);
      speakEnglishText(s.speech);

      document.getElementById('sceneTag').innerHTML = s.tag;
      const visualEl = document.getElementById('sceneVisual');
      visualEl.innerHTML = s.visual;
      visualEl.style.transform = 'scale(1.35)';
      setTimeout(() => { visualEl.style.transform = 'scale(1.0)'; }, 200);

      document.getElementById('captionMain').innerHTML = s.main;
      document.getElementById('captionSub').innerHTML = s.sub;

      const bg = document.getElementById('videoBg');
      bg.style.transform = `scale(${s.scale})`;
    }

    function loop(timestamp) {
      if (!isPlaying) return;
      if (!lastTimestamp) lastTimestamp = timestamp;
      const delta = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      currentTime += delta;

      if (currentTime >= TOTAL_DURATION) {
        currentTime = TOTAL_DURATION;
        pauseVideo();
        return;
      }

      let activeIndex = scenes.findIndex((sc, idx) => {
        const next = scenes[idx + 1];
        return currentTime >= sc.start && (!next || currentTime < next.start);
      });
      if (activeIndex !== -1) {
        updateScene(activeIndex);
      }

      const pct = (currentTime / TOTAL_DURATION) * 100;
      document.getElementById('progressBar').style.width = pct + '%';

      requestAnimationFrame(loop);
    }

    function togglePlay() {
      if (isPlaying) {
        pauseVideo();
      } else {
        playVideo();
      }
    }

    function playVideo() {
      if (currentTime >= TOTAL_DURATION) {
        currentTime = 0;
        currentSceneIndex = -1;
      }
      isPlaying = true;
      lastTimestamp = null;
      document.getElementById('playOverlayBtn').classList.add('hidden');
      requestAnimationFrame(loop);
    }

    function pauseVideo() {
      isPlaying = false;
      document.getElementById('playOverlayBtn').classList.remove('hidden');
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    function replay() {
      pauseVideo();
      currentTime = 0;
      currentSceneIndex = -1;
      document.getElementById('progressBar').style.width = '0%';
      updateScene(0);
      playVideo();
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateScene(0);
    });
  </script>
</body>
</html>
