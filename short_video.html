    const TOTAL_DURATION = 30.0;
    let isPlaying = false;

    let currentTime = 0;

    let currentSceneIndex = -1;

    // === Web Audio API BGM & 音效合成引擎 ===
    let audioCtx = null;
    let bgmMasterGain = null;
    let bgmInterval = null;
    let beatStep = 0;

    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        bgmMasterGain = audioCtx.createGain();
        bgmMasterGain.gain.setValueAtTime(soundEnabled ? 0.35 : 0, audioCtx.currentTime);
        bgmMasterGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // 合成重低音鼓點 (808 Sub-Bass Kick)
    function playSubBassKick() {
      if (!audioCtx || !soundEnabled) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const now = audioCtx.currentTime;

        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(38, now + 0.18);

        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

        osc.connect(gain);
        gain.connect(bgmMasterGain);

        osc.start(now);
        osc.stop(now + 0.22);
      } catch(e) {}
    }

    // 合成高頻節奏 Hi-Hat
    function playHiHat() {
      if (!audioCtx || !soundEnabled) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const now = audioCtx.currentTime;

        osc.type = 'highpass';
        osc.frequency.setValueAtTime(8000, now);

        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

        osc.connect(gain);
        gain.connect(bgmMasterGain);

        osc.start(now);
        osc.stop(now + 0.05);
      } catch(e) {}
    }

    // 場景切換專屬重低音震盪 (808 Sub-Drop)
    function playSceneTransitionDrop() {
      if (!audioCtx || !soundEnabled) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const now = audioCtx.currentTime;

        osc.type = 'sine';
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.exponentialRampToValueAtTime(32, now + 0.45);

        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

        osc.connect(gain);
        gain.connect(bgmMasterGain);

        osc.start(now);
        osc.stop(now + 0.5);
      } catch(e) {}
    }

    // 啟動 120 BPM Cyberpunk 背景節奏循環
    function startBgmEngine() {
      stopBgmEngine();
      initAudioContext();
      beatStep = 0;
      // 120 BPM = 0.5s 一拍，每 0.25s 走半拍
      bgmInterval = setInterval(() => {
        if (!isPlaying || !soundEnabled) return;
        if (beatStep % 2 === 0) {
          playSubBassKick();
        } else {
          playHiHat();
        }
        beatStep++;
      }, 250);
    }

    function stopBgmEngine() {
      if (bgmInterval) {
        clearInterval(bgmInterval);
        bgmInterval = null;
      }
    }

      if (!soundEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 1.08;
      utterance.pitch = 1.04;

      const voices = window.speechSynthesis.getVoices();
      if (voices.length > 0) {
        // 優先挑選微軟 Natural、Google US 或高音質美式發音
        const naturalVoice = voices.find(v => v.lang.includes('en') && (v.name.includes('Natural') || v.name.includes('Christopher') || v.name.includes('Guy') || v.name.includes('Jenny') || v.name.includes('Google US')));
        if (naturalVoice) {
          utterance.voice = naturalVoice;
        } else {
          const fallbackEn = voices.find(v => v.lang.startsWith('en'));
          if (fallbackEn) utterance.voice = fallbackEn;
        }
      }
      window.speechSynthesis.speak(utterance);
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').innerHTML = soundEnabled ? "🔊 Audio: ON" : "🔇 Audio: OFF";
      if (bgmMasterGain && audioCtx) {
        bgmMasterGain.gain.setValueAtTime(soundEnabled ? 0.35 : 0, audioCtx.currentTime);
      }
      if (!soundEnabled && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      } else if (soundEnabled && isPlaying && currentSceneIndex >= 0) {
        speakEnglishText(scenes[currentSceneIndex].speech);
      }
    }

    function updateScene(index) {
      if (index === currentSceneIndex) return;
      currentSceneIndex = index;
      const s = scenes[index];

      // 音效與語音
      if (s.subBass) {
        playSceneTransitionDrop();
      }
      speakEnglishText(s.speech);

      // 震撼震動特效 (Screen Shake & Glitch)
      const container = document.getElementById('sceneContainer');
      const redBorder = document.getElementById('redAlertBorder');
      
      if (s.shake) {
        container.classList.remove('glitch-shake');
        void container.offsetWidth; // 強制重繪
        container.classList.add('glitch-shake');
      }
      if (s.redAlert) {
        redBorder.style.display = 'block';
      } else {
        redBorder.style.display = 'none';
      }

      // 標籤、視覺與文字更新
      document.getElementById('sceneTag').innerHTML = s.tag;
      const visualEl = document.getElementById('sceneVisual');
      visualEl.innerHTML = s.visual;
      visualEl.style.transform = 'scale(1.35)';
      setTimeout(() => { visualEl.style.transform = 'scale(1.0)'; }, 220);

      document.getElementById('captionMain').innerHTML = s.main;
      document.getElementById('captionSub').innerHTML = s.sub;

      const chipEl = document.getElementById('microChip');
      if (s.chip) {
        chipEl.innerText = s.chip;
        chipEl.style.display = 'inline-flex';
      } else {
        chipEl.style.display = 'none';
      }

      const bg = document.getElementById('videoBg');
      bg.style.transform = `scale(${s.scale})`;

      // 結尾場景微按鈕變更
      const ctaBtnAction = document.getElementById('ctaBtnAction');
      if (index === 5) {
        ctaBtnAction.innerText = "Get v1.0.3 Now ➔";
        ctaBtnAction.style.background = "#00ff88";
      } else {
        ctaBtnAction.innerText = "Download ➔";
        ctaBtnAction.style.background = "linear-gradient(135deg, #00f0ff, #0077ff)";
      }
    }

    function updateStoriesProgressBar(time) {
      scenes.forEach((sc, idx) => {
        const seg = document.getElementById('seg' + idx);
        if (!seg) return;
        const next = scenes[idx + 1];
        const segEnd = next ? next.start : TOTAL_DURATION;
        
        if (time < sc.start) {
          seg.style.width = '0%';
        } else if (time >= segEnd) {
          seg.style.width = '100%';
        } else {
          const segProgress = ((time - sc.start) / sc.duration) * 100;
          seg.style.width = Math.min(100, Math.max(0, segProgress)) + '%';
        }
      });
    }

    function loop(timestamp) {
      if (!isPlaying) return;
      if (!lastTimestamp) lastTimestamp = timestamp;
      const delta = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      currentTime += delta;

      if (currentTime >= TOTAL_DURATION) {
        currentTime = TOTAL_DURATION;
        updateStoriesProgressBar(TOTAL_DURATION);
        pauseVideo();
        return;
      }

      let activeIndex = scenes.findIndex((sc, idx) => {
        const next = scenes[idx + 1];
        return currentTime >= sc.start && (!next || currentTime < next.start);
      });
      if (activeIndex !== -1) {
        updateScene(activeIndex);
      }

      updateStoriesProgressBar(currentTime);
      requestAnimationFrame(loop);
    }

    function togglePlay() {
      if (isPlaying) {
        pauseVideo();
      } else {
        playVideo();
      }
    }

    function playVideo() {
      initAudioContext();
      if (currentTime >= TOTAL_DURATION) {
        currentTime = 0;
        currentSceneIndex = -1;
      }
      isPlaying = true;
      lastTimestamp = null;
      document.getElementById('playOverlayBtn').classList.add('hidden');
      startBgmEngine();
      requestAnimationFrame(loop);
    }

    function pauseVideo() {
      isPlaying = false;
      document.getElementById('playOverlayBtn').classList.remove('hidden');
      stopBgmEngine();
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    function jumpToScene(idx) {
      if (idx < 0 || idx >= scenes.length) return;
      currentTime = scenes[idx].start;
      updateScene(idx);
      updateStoriesProgressBar(currentTime);
      if (!isPlaying) {
        playVideo();
      }
    }

    function handleCtaClick() {
      if (window.parent && window.parent !== window) {
        try {
          const dl = window.parent.document.getElementById('download');
          if (dl) dl.scrollIntoView({ behavior: 'smooth' });
          if (typeof window.parent.showDemoAlert === 'function') {
            window.parent.showDemoAlert();
          }
        } catch(e) {}
      }
    }

    function likeVideo(btn) {
      const countEl = document.getElementById('likeCount');
      countEl.innerText = "12.9K";
      btn.querySelector('.side-icon').style.transform = "scale(1.4)";
      setTimeout(() => { btn.querySelector('.side-icon').style.transform = "scale(1)"; }, 250);
    }

    function sharePrompt() {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(window.location.href);
        alert("Link copied to clipboard! Share on TikTok / X / Reels!");
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateScene(0);
      updateStoriesProgressBar(0);
      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {};
      }
    });
  </script>
</body>
</html>
