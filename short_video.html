<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>JBA128G3 Storage Shield - 45s Motion Graphics Explainer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    .video-viewport {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: #05080e;
    }

    /* 背景圖片與動態景深 */
    .video-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('video_bg.jpg') center/cover no-repeat;
      filter: brightness(0.55) contrast(1.2);
      transition: transform 1s cubic-bezier(0.25, 0.8, 0.25, 1);
      z-index: 1;
    }
    .video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(0, 15, 30, 0.2) 0%, rgba(2, 6, 14, 0.95) 100%);
      z-index: 2;
    }

    /* 科技感全域掃描光束 */
    .scan-line {
      position: absolute;
      top: -20%;
      left: 0;
      width: 100%;
      height: 15%;
      background: linear-gradient(to bottom, transparent, rgba(0, 240, 255, 0.35), transparent);
      z-index: 3;
      animation: scanAnim 3.2s linear infinite;
      pointer-events: none;
    }
    @keyframes scanAnim {
      0% { top: -20%; }
      100% { top: 110%; }
    }

    /* 頂部 6 段分段 Stories 進度條 */
    .stories-bar-container {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      height: 4px;
      display: flex;
      gap: 5px;
      z-index: 20;
    }
    .story-seg {
      flex: 1;
      height: 100%;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 3px;
      overflow: hidden;
      cursor: pointer;
    }
    .story-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00f0ff, #00ff88);
      box-shadow: 0 0 10px #00f0ff;
      border-radius: 3px;
      transition: width 0.08s linear;
    }

    /* 頂部品牌標記 */
    .top-brand {
      position: absolute;
      top: 22px;
      left: 14px;
      z-index: 15;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 900;
      font-size: 0.75rem;
      letter-spacing: 0.8px;
      color: #fff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    }
    .top-brand span { color: #00f0ff; }

    /* 聲音切換按鈕 (右上角) */
    .sound-btn {
      position: absolute;
      top: 20px;
      right: 14px;
      z-index: 20;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(0, 240, 255, 0.45);
      color: #00f0ff;
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
      transition: all 0.2s ease;
    }
    .sound-btn:hover {
      background: rgba(0, 240, 255, 0.2);
    }

    /* 右側 TikTok 風格浮動愛心與分享裝飾 */
    .side-actions {
      position: absolute;
      right: 10px;
      bottom: 85px;
      z-index: 15;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    .side-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.65rem;
      color: #cbd5e0;
      gap: 2px;
      cursor: pointer;
    }
    .side-icon {
      width: 36px;
      height: 36px;
      background: rgba(15, 23, 36, 0.75);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      backdrop-filter: blur(4px);
      transition: transform 0.2s ease;
    }
    .side-btn:hover .side-icon {
      transform: scale(1.15);
      border-color: #00f0ff;
    }

    /* 中央主舞台容器 */
    .scene-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 45px 16px 85px 16px;
      text-align: center;
      transition: filter 0.2s ease;
    }

    /* 震撼震動特效 (Screen Shake & Glitch) */
    .glitch-shake {
      animation: screenShake 0.45s ease;
    }
    @keyframes screenShake {
      0%, 100% { transform: translate(0, 0) scale(1); }
      15% { transform: translate(-7px, 5px) scale(1.02); filter: drop-shadow(0 0 16px #ff0055); }
      35% { transform: translate(7px, -5px) scale(0.99); filter: hue-rotate(90deg); }
      55% { transform: translate(-5px, 4px) scale(1.01); filter: drop-shadow(0 0 16px #00f0ff); }
      75% { transform: translate(4px, -2px) scale(1); filter: none; }
    }

    /* 紅色警報邊框脈衝 (Scene 1) */
    .red-alert-border {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 3px solid rgba(255, 51, 102, 0.75);
      box-shadow: inset 0 0 45px rgba(255, 51, 102, 0.55);
      z-index: 4;
      pointer-events: none;
      animation: alertPulse 0.8s ease infinite alternate;
    }
    @keyframes alertPulse {
      0% { opacity: 0.3; }
      100% { opacity: 0.95; }
    }

    /* 場景標籤 */
    .scene-tag {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 14px;
      border-radius: 20px;
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid #00f0ff;
      color: #00f0ff;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      display: inline-block;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      animation: tagPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes tagPop {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* === 核心視覺動態舞台 (Motion Graphics Centerpiece) === */
    .motion-stage {
      width: 100%;
      height: 140px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    /* 1. 左右分屏殘酷對比動態 (Scene 0) */
    .split-screen-box {
      width: 95%;
      height: 125px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    .split-half {
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .half-danger {
      background: rgba(255, 51, 102, 0.12);
      border-right: 2px dashed rgba(255, 51, 102, 0.4);
    }
    .half-secure {
      background: rgba(0, 240, 255, 0.1);
    }
    .split-icon { font-size: 2.2rem; margin-bottom: 4px; }
    .split-label { font-size: 0.7rem; font-weight: 800; color: #fff; text-transform: uppercase; }
    .split-status-bad {
      font-size: 0.62rem;
      color: #ff3366;
      font-weight: 800;
      margin-top: 4px;
      animation: flashText 1s infinite alternate;
    }
    .split-status-good {
      font-size: 0.62rem;
      color: #00ff88;
      font-weight: 800;
      margin-top: 4px;
    }
    @keyframes flashText {
      0% { opacity: 0.4; } 100% { opacity: 1; }
    }
    .radar-beam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: #ff3366;
      box-shadow: 0 0 10px #ff3366;
      animation: radarScan 1.8s linear infinite;
    }
    @keyframes radarScan {
      0% { top: 0%; } 100% { top: 100%; }
    }

    /* 2. 後量子幾何旋轉光盾 (Scene 1) */
    .quantum-shield-box {
      width: 130px;
      height: 130px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .shield-ring-outer {
      position: absolute;
      width: 120px;
      height: 120px;
      border: 2px dashed #00f0ff;
      border-radius: 50%;
      animation: rotateClockwise 8s linear infinite;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
    }
    .shield-ring-inner {
      position: absolute;
      width: 90px;
      height: 90px;
      border: 2px solid #bf5af2;
      border-radius: 50%;
      animation: rotateCounter 6s linear infinite;
      box-shadow: 0 0 15px rgba(191, 90, 242, 0.5);
    }
    .shield-center-core {
      font-size: 3rem;
      z-index: 5;
      filter: drop-shadow(0 0 20px #00f0ff);
      animation: pulseCore 2s ease infinite alternate;
    }
    @keyframes rotateClockwise { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes rotateCounter { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
    @keyframes pulseCore { 0% { transform: scale(0.95); } 100% { transform: scale(1.1); } }

    /* 3. 20GB 大專案無卡頓串流動態 (Scene 2) */
    .vault-stream-box {
      width: 92%;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .stream-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      font-weight: 700;
      color: #fff;
    }
    .stream-pipe {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }
    .stream-flow-bar {
      height: 100%;
      width: 88%;
      background: linear-gradient(90deg, #0077ff, #00f0ff, #00ff88);
      box-shadow: 0 0 15px #00f0ff;
      border-radius: 6px;
      animation: flowGlow 1.2s linear infinite;
    }
    @keyframes flowGlow {
      0% { filter: brightness(1); } 50% { filter: brightness(1.5); } 100% { filter: brightness(1); }
    }
    .stream-metrics {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      color: #8c9ba5;
    }
    .metric-chip {
      color: #00ff88;
      background: rgba(0, 255, 136, 0.1);
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 700;
    }

    /* 4. JBA-Shredder 物理粉碎粒子動態 (Scene 3) */
    .shredder-box {
      width: 92%;
      background: rgba(20, 5, 10, 0.6);
      border: 1px solid rgba(255, 51, 102, 0.4);
      border-radius: 12px;
      padding: 12px 14px;
      position: relative;
      overflow: hidden;
    }
    .binary-stream {
      font-family: monospace;
      font-size: 0.85rem;
      letter-spacing: 2px;
      color: #ff3366;
      font-weight: 900;
      margin-bottom: 6px;
      text-shadow: 0 0 10px #ff3366;
    }
    .shred-laser {
      width: 100%;
      height: 2px;
      background: #ffe600;
      box-shadow: 0 0 12px #ff3366, 0 0 20px #ffe600;
      animation: laserSweep 1.5s ease-in-out infinite alternate;
    }
    @keyframes laserSweep { 0% { transform: translateY(-5px); } 100% { transform: translateY(15px); } }
    .shred-dust-text {
      font-size: 0.68rem;
      font-weight: 800;
      color: #cbd5e1;
      margin-top: 6px;
    }

    /* 5. 100% Bit-Perfect 綠寶石認證 (Scene 4) */
    .bit-perfect-badge-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .emerald-seal {
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, rgba(0, 255, 136, 0.25), rgba(0, 240, 255, 0.25));
      border: 2px solid #00ff88;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      box-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
      animation: sealGlow 2s ease infinite alternate;
    }
    @keyframes sealGlow { 0% { transform: scale(0.95); } 100% { transform: scale(1.08); } }
    .seal-text {
      font-size: 0.72rem;
      font-weight: 800;
      color: #00ff88;
      letter-spacing: 1px;
    }

    /* 6. 終極榮耀與下載 CTA (Scene 5) */
    .sovereignty-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .trophy-icon {
      font-size: 3.6rem;
      filter: drop-shadow(0 0 25px rgba(255, 230, 0, 0.7));
      animation: trophyFloat 2s ease infinite alternate;
    }
    @keyframes trophyFloat { 0% { transform: translateY(0); } 100% { transform: translateY(-8px); } }

    /* 爆款英文彈跳動態大字報 */
    .caption-box {
      min-height: 90px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }
    .caption-main {
      font-size: 1.35rem;
      font-weight: 900;
      line-height: 1.28;
      color: #ffffff;
      text-shadow: 0 3px 10px rgba(0,0,0,0.9), 0 0 20px rgba(0,0,0,0.9);
      letter-spacing: 0.3px;
      animation: captionPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes captionPop {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .highlight-yellow {
      color: #ffe600;
      text-shadow: 0 0 18px rgba(255, 230, 0, 0.9);
      font-size: 1.48rem;
    }
    .highlight-cyan {
      color: #00f0ff;
      text-shadow: 0 0 18px rgba(0, 240, 255, 0.9);
      font-size: 1.48rem;
    }
    .highlight-red {
      color: #ff3366;
      text-shadow: 0 0 18px rgba(255, 51, 102, 0.9);
      font-size: 1.48rem;
    }
    .caption-sub {
      font-size: 0.82rem;
      color: #a0aec0;
      line-height: 1.45;
      max-width: 320px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    }

    /* 專屬微視覺組件 (Micro Visual Components) */
    .micro-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(0, 255, 136, 0.4);
      color: #00ff88;
      font-size: 0.7rem;
      padding: 3px 10px;
      border-radius: 12px;
      margin-top: 8px;
      font-weight: 700;
      box-shadow: 0 0 12px rgba(0, 255, 136, 0.2);
    }

    /* 播放控制浮層 (點擊播放 / 暫停) */
    .play-overlay-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 72px;
      height: 72px;
      background: rgba(0, 240, 255, 0.85);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 30;
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.8);
      transition: all 0.25s ease;
    }
    .play-overlay-btn:hover {
      transform: translate(-50%, -50%) scale(1.12);
      background: #00f0ff;
    }
    .play-overlay-btn svg {
      width: 30px;
      height: 30px;
      fill: #000;
      margin-left: 4px;
    }
    .play-overlay-btn.hidden {
      display: none;
    }

    /* 底部導流卡 (CTA Banner) */
    .bottom-cta-banner {
      position: absolute;
      bottom: 14px;
      left: 14px;
      right: 14px;
      background: rgba(13, 21, 34, 0.88);
      border: 1px solid rgba(0, 240, 255, 0.4);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 15;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .bottom-cta-banner:hover {
      border-color: #00f0ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.35);
    }
    .cta-text-title {
      font-size: 0.8rem;
      font-weight: 800;
      color: #fff;
    }
    .cta-text-sub {
      font-size: 0.68rem;
      color: #8c9ba5;
    }
    .cta-btn-mini {
      background: linear-gradient(135deg, #00f0ff, #0077ff);
      border: none;
      color: #000;
      font-weight: 800;
      font-size: 0.72rem;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
    }
  </style>
</head>
<body>
  <div class="video-viewport" id="viewport" onclick="togglePlay()">
    <!-- 動態背景與網格遮罩 -->
    <div class="video-bg" id="videoBg"></div>
    <div class="video-overlay"></div>
    <div class="scan-line"></div>
    <div id="redAlertBorder" style="display:none;" class="red-alert-border"></div>

    <!-- 頂部 6 段分段進度條 (Stories Bar) -->
    <div class="stories-bar-container">
      <div class="story-seg" onclick="event.stopPropagation(); jumpToScene(0);"><div class="story-fill" id="seg0"></div></div>
      <div class="story-seg" onclick="event.stopPropagation(); jumpToScene(1);"><div class="story-fill" id="seg1"></div></div>
      <div class="story-seg" onclick="event.stopPropagation(); jumpToScene(2);"><div class="story-fill" id="seg2"></div></div>
      <div class="story-seg" onclick="event.stopPropagation(); jumpToScene(3);"><div class="story-fill" id="seg3"></div></div>
      <div class="story-seg" onclick="event.stopPropagation(); jumpToScene(4);"><div class="story-fill" id="seg4"></div></div>
      <div class="story-seg" onclick="event.stopPropagation(); jumpToScene(5);"><div class="story-fill" id="seg5"></div></div>
    </div>

    <!-- 頂部品牌標記 -->
    <div class="top-brand">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" style="color: #00f0ff;">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      JBA128G3 <span>OFFICIAL</span>
    </div>

    <!-- 右上角聲音控制按鈕 (控制語音與 BGM) -->
    <button class="sound-btn" id="soundBtn" onclick="event.stopPropagation(); toggleSound();">
      🔊 Audio: ON
    </button>

    <!-- 右側 TikTok 互動元素裝飾 -->
    <div class="side-actions" onclick="event.stopPropagation();">
      <div class="side-btn" onclick="likeVideo(this)">
        <div class="side-icon" style="color:#ff3366;">❤️</div>
        <span id="likeCount">12.8K</span>
      </div>
      <div class="side-btn" onclick="sharePrompt()">
        <div class="side-icon" style="color:#00f0ff;">🔗</div>
        <span>Share</span>
      </div>
    </div>

    <!-- 中央分鏡資訊與動態舞台 -->
    <div class="scene-container" id="sceneContainer">
      <div class="scene-tag" id="sceneTag">⚠️ SPLIT-SCREEN REALITY CHECK</div>
      
      <!-- 動態視覺核心舞台 -->
      <div class="motion-stage" id="motionStage">
        <!-- 動態由 JavaScript updateScene 實時渲染各場景專屬動畫組件 -->
      </div>

      <div class="caption-box">
        <div class="caption-main" id="captionMain">
          Think Deleting Files<br><span class="highlight-red">Makes Them Safe?</span>
        </div>
        <div class="caption-sub" id="captionSub">
          Wrong! Recovery tools can uncover your secrets in 3 seconds!
        </div>
        <div id="microChip" class="micro-chip" style="display:none;"></div>
      </div>
    </div>

    <!-- 畫面中央播放 / 暫停大按鈕 -->
    <div class="play-overlay-btn" id="playOverlayBtn">
      <svg viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z"/>
      </svg>
    </div>

    <!-- 底部導流橫幅 (點擊直達官網下載區) -->
    <div class="bottom-cta-banner" onclick="event.stopPropagation(); handleCtaClick();">
      <div>
        <div class="cta-text-title">JBA128G3 Storage Shield (v1.0.3)</div>
        <div class="cta-text-sub">100% Offline ｜ Post-Quantum Stream Encryption</div>
      </div>
      <button class="cta-btn-mini" id="ctaBtnAction">Download ➔</button>
    </div>
  </div>

  <script>
    // 6 段 45 秒旗艦級動態動畫分鏡數據 (節奏從容舒適，資訊充分展示)
    const scenes = [
      {
        start: 0,
        duration: 7.5,
        tag: "⚠️ SPLIT-SCREEN REALITY CHECK",
        animType: "split-screen",

    const TOTAL_DURATION = 45.0;
    let isPlaying = false;
    let soundEnabled = true;
    let currentTime = 0;
    let lastTimestamp = null;
    let currentSceneIndex = -1;

    // === Web Audio API BGM & 音效合成引擎 ===
    let audioCtx = null;
    let bgmMasterGain = null;
    let bgmInterval = null;
    let beatStep = 0;

    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        bgmMasterGain = audioCtx.createGain();
        bgmMasterGain.gain.setValueAtTime(soundEnabled ? 0.32 : 0, audioCtx.currentTime);
        bgmMasterGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // 合成重低音鼓點 (808 Sub-Bass Kick)
    function playSubBassKick() {
      if (!audioCtx || !soundEnabled) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const now = audioCtx.currentTime;

        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(36, now + 0.18);

        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

        osc.connect(gain);
        gain.connect(bgmMasterGain);

        osc.start(now);
        osc.stop(now + 0.22);
      } catch(e) {}
    }

    // 合成高頻節奏 Hi-Hat
    function playHiHat() {
      if (!audioCtx || !soundEnabled) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const now = audioCtx.currentTime;

        osc.type = 'highpass';
        osc.frequency.setValueAtTime(8500, now);

        gain.gain.setValueAtTime(0.07, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

        osc.connect(gain);
        gain.connect(bgmMasterGain);

        osc.start(now);
        osc.stop(now + 0.05);
      } catch(e) {}
    }

    // 場景切換專屬重低音震盪 (808 Sub-Drop)
    function playSceneTransitionDrop() {
      if (!audioCtx || !soundEnabled) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const now = audioCtx.currentTime;

        osc.type = 'sine';
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.exponentialRampToValueAtTime(32, now + 0.45);

        gain.gain.setValueAtTime(0.48, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

        osc.connect(gain);
        gain.connect(bgmMasterGain);

        osc.start(now);
        osc.stop(now + 0.5);
      } catch(e) {}
    }

    // 啟動 120 BPM Cyberpunk 背景節奏循環
    function startBgmEngine() {
      stopBgmEngine();
      initAudioContext();
      beatStep = 0;
      bgmInterval = setInterval(() => {
        if (!isPlaying || !soundEnabled) return;
        if (beatStep % 2 === 0) {
          playSubBassKick();
        } else {
          playHiHat();
        }
        beatStep++;
      }, 250);
    }

    function stopBgmEngine() {
      if (bgmInterval) {
        clearInterval(bgmInterval);
        bgmInterval = null;
      }
    }

    // === 自然真人語音 (TTS) 選擇最佳英文發音 ===
    function speakEnglishText(text) {
      if (!soundEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 1.02; // 從容優雅的科技行銷語速
      utterance.pitch = 1.02;

      const voices = window.speechSynthesis.getVoices();
      if (voices.length > 0) {
        const naturalVoice = voices.find(v => v.lang.includes('en') && (v.name.includes('Natural') || v.name.includes('Christopher') || v.name.includes('Guy') || v.name.includes('Jenny') || v.name.includes('Google US')));
        if (naturalVoice) {
          utterance.voice = naturalVoice;
        } else {
          const fallbackEn = voices.find(v => v.lang.startsWith('en'));
          if (fallbackEn) utterance.voice = fallbackEn;
        }
      }
      window.speechSynthesis.speak(utterance);
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').innerHTML = soundEnabled ? "🔊 Audio: ON" : "🔇 Audio: OFF";
      if (bgmMasterGain && audioCtx) {
        bgmMasterGain.gain.setValueAtTime(soundEnabled ? 0.32 : 0, audioCtx.currentTime);
      }
      if (!soundEnabled && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      } else if (soundEnabled && isPlaying && currentSceneIndex >= 0) {
        speakEnglishText(scenes[currentSceneIndex].speech);
      }
    }

    // 動態渲染場景動畫組件 (Dynamic Component Injection)
    function renderMotionGraphic(type) {
      const stage = document.getElementById('motionStage');
      if (type === 'split-screen') {
        stage.innerHTML = `
          <div class="split-screen-box">
            <div class="split-half half-danger">
              <div class="radar-beam"></div>
              <div class="split-icon">🗑️</div>
              <div class="split-label">Recycle Bin</div>
              <div class="split-status-bad">⚠️ LEAKED IN 3s!</div>
            </div>
            <div class="split-half half-secure">
              <div class="split-icon">🛡️</div>
              <div class="split-label">JBA128G3</div>
              <div class="split-status-good">✅ 0 BYTES FOUND</div>
            </div>
          </div>
        `;
      } else if (type === 'quantum-shield') {
        stage.innerHTML = `
          <div class="quantum-shield-box">
            <div class="shield-ring-outer"></div>
            <div class="shield-ring-inner"></div>
            <div class="shield-center-core">🔒</div>
          </div>
        `;
      } else if (type === 'vault-stream') {
        stage.innerHTML = `
          <div class="vault-stream-box">
            <div class="stream-header">
              <span>📁 20.4 GB Project Folder</span>
              <span style="color:#00ff88;">64MB Streaming</span>
            </div>
            <div class="stream-pipe">
              <div class="stream-flow-bar"></div>
            </div>
            <div class="stream-metrics">
              <span class="metric-chip">RAM: 148 MB [LOCKED]</span>
              <span style="color:#00f0ff;">60 FPS Wire-Speed</span>
            </div>
          </div>
        `;
      } else if (type === 'shredder') {
        stage.innerHTML = `
          <div class="shredder-box">
            <div class="binary-stream">01101001 11010010 00110101</div>
            <div class="shred-laser"></div>
            <div class="shred-dust-text">💥 JBA-Shredder: 3-Pass Physical Overwrite Active</div>
          </div>
        `;
      } else if (type === 'bit-perfect') {
        stage.innerHTML = `
          <div class="bit-perfect-badge-box">
            <div class="emerald-seal">💎</div>
            <div class="seal-text">100% BIT-PERFECT RESTORE</div>
          </div>
        `;
      } else if (type === 'sovereignty') {
        stage.innerHTML = `
          <div class="sovereignty-box">
            <div class="trophy-icon">🏆</div>
          </div>
        `;
      }
    }

    function updateScene(index) {
      if (index === currentSceneIndex) return;
      currentSceneIndex = index;
      const s = scenes[index];

      // 音效與語音
      if (s.subBass) {
        playSceneTransitionDrop();
      }
      speakEnglishText(s.speech);

      // 動態動畫渲染
      renderMotionGraphic(s.animType);

      // 震撼震動特效 (Screen Shake & Glitch)
      const container = document.getElementById('sceneContainer');
      const redBorder = document.getElementById('redAlertBorder');
      
      if (s.shake) {
        container.classList.remove('glitch-shake');
        void container.offsetWidth; // 強制重繪
        container.classList.add('glitch-shake');
      }
      if (s.redAlert) {
        redBorder.style.display = 'block';
      } else {
        redBorder.style.display = 'none';
      }

      // 標籤、視覺與文字更新
      document.getElementById('sceneTag').innerHTML = s.tag;
      document.getElementById('captionMain').innerHTML = s.main;
      document.getElementById('captionSub').innerHTML = s.sub;

      const chipEl = document.getElementById('microChip');
      if (s.chip) {
        chipEl.innerText = s.chip;
        chipEl.style.display = 'inline-flex';
      } else {
        chipEl.style.display = 'none';
      }

      const bg = document.getElementById('videoBg');
      bg.style.transform = `scale(${s.scale})`;

      // 結尾場景微按鈕變更
      const ctaBtnAction = document.getElementById('ctaBtnAction');
      if (index === 5) {
        ctaBtnAction.innerText = "Get v1.0.3 Now ➔";
        ctaBtnAction.style.background = "#00ff88";
      } else {
        ctaBtnAction.innerText = "Download ➔";
        ctaBtnAction.style.background = "linear-gradient(135deg, #00f0ff, #0077ff)";
      }
    }

    function updateStoriesProgressBar(time) {
      scenes.forEach((sc, idx) => {
        const seg = document.getElementById('seg' + idx);
        if (!seg) return;
        const next = scenes[idx + 1];
        const segEnd = next ? next.start : TOTAL_DURATION;
        
        if (time < sc.start) {
          seg.style.width = '0%';
        } else if (time >= segEnd) {
          seg.style.width = '100%';
        } else {
          const segProgress = ((time - sc.start) / sc.duration) * 100;
          seg.style.width = Math.min(100, Math.max(0, segProgress)) + '%';
        }
      });
    }

    function loop(timestamp) {
      if (!isPlaying) return;
      if (!lastTimestamp) lastTimestamp = timestamp;
      const delta = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      currentTime += delta;

      if (currentTime >= TOTAL_DURATION) {
        currentTime = TOTAL_DURATION;
        updateStoriesProgressBar(TOTAL_DURATION);
        pauseVideo();
        return;
      }

      let activeIndex = scenes.findIndex((sc, idx) => {
        const next = scenes[idx + 1];
        return currentTime >= sc.start && (!next || currentTime < next.start);
      });
      if (activeIndex !== -1) {
        updateScene(activeIndex);
      }

      updateStoriesProgressBar(currentTime);
      requestAnimationFrame(loop);
    }

    function togglePlay() {
      if (isPlaying) {
        pauseVideo();
      } else {
        playVideo();
      }
    }

    function playVideo() {
      initAudioContext();
      if (currentTime >= TOTAL_DURATION) {
        currentTime = 0;
        currentSceneIndex = -1;
      }
      isPlaying = true;
      lastTimestamp = null;
      document.getElementById('playOverlayBtn').classList.add('hidden');
      startBgmEngine();
      requestAnimationFrame(loop);
    }

    function pauseVideo() {
      isPlaying = false;
      document.getElementById('playOverlayBtn').classList.remove('hidden');
      stopBgmEngine();
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    function jumpToScene(idx) {
      if (idx < 0 || idx >= scenes.length) return;
      currentTime = scenes[idx].start;
      updateScene(idx);
      updateStoriesProgressBar(currentTime);
      if (!isPlaying) {
        playVideo();
      }
    }

    function handleCtaClick() {
      if (window.parent && window.parent !== window) {
        try {
          const dl = window.parent.document.getElementById('download');
          if (dl) dl.scrollIntoView({ behavior: 'smooth' });
          if (typeof window.parent.showDemoAlert === 'function') {
            window.parent.showDemoAlert();
          }
        } catch(e) {}
      }
    }

    function likeVideo(btn) {
      const countEl = document.getElementById('likeCount');
      countEl.innerText = "12.9K";
      btn.querySelector('.side-icon').style.transform = "scale(1.4)";
      setTimeout(() => { btn.querySelector('.side-icon').style.transform = "scale(1)"; }, 250);
    }

    function sharePrompt() {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(window.location.href);
        alert("Link copied to clipboard! Share on TikTok / X / Reels!");
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateScene(0);
      updateStoriesProgressBar(0);
      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {};
      }
    });
  </script>
